# Triggered on version tags (e.g. v3.1.0). Packs and pushes all packages to NuGet.
# Tests run in build-and-test.yml — this workflow is release-only.

name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: RoutyaBuild

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore (Core)
      run: dotnet restore Routya.Core/Routya.Core.csproj

    - name: Restore (SourceGenerators)
      run: dotnet restore Routya.SourceGenerators/Routya.SourceGenerators.csproj

    - name: Restore (Package)
      run: dotnet restore Routya.Package/Routya.Package.csproj

    - name: Build (Core)
      run: dotnet build Routya.Core/Routya.Core.csproj --configuration Release --no-restore

    - name: Build (SourceGenerators)
      run: dotnet build Routya.SourceGenerators/Routya.SourceGenerators.csproj --configuration Release --no-restore

    - name: Build (Package)
      run: dotnet build Routya.Package/Routya.Package.csproj --configuration Release --no-restore

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Pack (Core)
      run: dotnet pack Routya.Core/Routya.Core.csproj --configuration Release /p:PackageVersion=${{ env.VERSION }} --no-build --output ./nupkgs

    - name: Pack (SourceGenerators)
      run: dotnet pack Routya.SourceGenerators/Routya.SourceGenerators.csproj --configuration Release /p:PackageVersion=${{ env.VERSION }} --no-build --output ./nupkgs

    - name: Pack (Routya)
      run: dotnet pack Routya.Package/Routya.Package.csproj --configuration Release /p:PackageVersion=${{ env.VERSION }} --no-build --output ./nupkgs

    - name: Push to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
